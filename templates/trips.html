<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Trip Dispatcher</title>
  </head>
  <body>
    <div class="d-flex">
      <nav id="sidebar" class="p-3 bg-white border-end">
        <h5>System Menu</h5>
        <ul class="list-group">
          <li class="list-group-item"><a href="/dashboard">Dashboard</a></li>
          <li class="list-group-item">
            <a href="/trips" class="custom-active">Trips</a>
          </li>
        </ul>
      </nav>

      <main class="p-4 w-100">
        <h3>Trip Dispatcher</h3>
        <form id="tripForm" class="card p-3 mb-4">
          <input
            name="vehicle"
            class="form-control mb-2"
            placeholder="Vehicle"
            required
          />
          <input
            name="driver"
            class="form-control mb-2"
            placeholder="Driver"
            required
          />
          <input
            name="source"
            class="form-control mb-2"
            placeholder="Source"
            required
          />
          <input
            name="destination"
            class="form-control mb-2"
            placeholder="Destination"
            required
          />
          <button type="submit" class="btn btn-primary">Dispatch</button>
        </form>

        <table class="table bg-white">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Driver</th>
              <th>Route</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tripTableBody"></tbody>
        </table>
      </main>
    </div>
    <script>
      document
        .getElementById("tripForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          await fetch("/api/trips", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(formData)),
          });
          location.reload();
        });
    </script>
  </body>
</html>
