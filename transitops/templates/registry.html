<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <style>
      .status-Available {
        color: green;
        font-weight: bold;
      }
      .status-On-Trip {
        color: orange;
        font-weight: bold;
      }
    </style>

    <h2>Fleet Registry</h2>
    <table>
      <tr>
        <th>License Plate</th>
        <th>Make</th>
        <th>Status</th>
      </tr>
      {% for vehicle in vehicles %}
      <tr>
        <td>{{ vehicle.license_plate }}</td>
        <td>{{ vehicle.make }}</td>
        <td>
          <span class="status-{{ vehicle.status }}">{{ vehicle.status }}</span>
        </td>
      </tr>
      {% endfor %}
    </table>
    <a href="/dashboard">Back to Dashboard</a>
  </body>
</html>
